name: Werkstatt numbers

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [prototype-deployed]

concurrency:
  group: werkstatt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/werkstatt.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.WERKSTATT_TOKEN }}
      - run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: update werkstatt numbers'
          git pull --rebase
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --verbose --log-opts="HEAD^..HEAD"
          git push
