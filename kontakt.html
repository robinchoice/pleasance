<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt — Pleasance</title>
  <meta name="description" content="Coaching, Webdesign oder Musik — such dir aus, worum es geht. Robin Wahl meldet sich innerhalb weniger Tage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260520">
  <script defer data-domain="pleasance.org" src="https://plausible.diespaetzles.lol/js/script.js"></script>
</head>
<body data-page="kontakt">

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__logo">Pleasance</a>
    <ul class="nav__links" id="navLinks">
      <li><a href="index.html" data-i18n="nav.coaching">Coaching</a></li>
      <li><a href="ueber.html" data-i18n="nav.ueber">Über</a></li>
      <li><a href="kontakt.html" data-i18n="nav.kontakt">Kontakt</a></li>
    </ul>
    <div class="nav__tools"></div>
    <button class="nav__toggle" id="navToggle" aria-label="Menü öffnen">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Hero -->
  <div class="page-hero reveal">
    <span class="page-hero__label" data-i18n="kontakt.hero.label">Kontakt</span>
    <h1 data-i18n="kontakt.hero.h1">Sprechen wir.</h1>
    <p class="hero__subtitle" style="margin-top: 1rem;" data-i18n="kontakt.hero.subtitle">
      Such dir aus, worum es geht. Ich melde mich innerhalb weniger Tage.
    </p>
  </div>

  <!-- Kontaktformular -->
  <div class="contact-form reveal">
    <form id="contactForm" novalidate>

      <div class="form-field">
        <label data-i18n="kontakt.form.topic_label">Worum geht es?</label>
        <div class="form-topics" role="group">
          <button type="button" class="form-topic is-active" data-topic="coaching" data-i18n="kontakt.form.topic_coaching">Coaching</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="contactName" data-i18n="kontakt.form.name_label">Dein Name</label>
          <input type="text" id="contactName" name="name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="contactEmail" data-i18n="kontakt.form.email_label">Deine E-Mail</label>
          <input type="email" id="contactEmail" name="email" autocomplete="email" required>
        </div>
      </div>

      <div class="form-field">
        <label for="contactMessage" data-i18n="kontakt.form.message_label">Deine Nachricht</label>
        <textarea id="contactMessage" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn btn--primary" id="contactSubmit" data-i18n="kontakt.form.submit">Absenden</button>
      <div class="form-status" id="formStatus" role="alert" aria-live="polite"></div>

    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__main">
      <div class="footer__brand">
        <span class="footer__logo">Pleasance</span>
        <p class="footer__tagline" data-i18n="footer.tagline">Ein Atelier für Dinge, die mit Sorgfalt gemacht sind.</p>
      </div>
      <nav class="footer__nav">
        <h4 data-i18n="footer.mehr">Mehr</h4>
        <a href="index.html" data-i18n="nav.coaching">Coaching</a>
        <a href="ueber.html" data-i18n="nav.ueber">Über</a>
        <a href="kontakt.html" data-i18n="nav.kontakt">Kontakt</a>
      </nav>
      <nav class="footer__nav">
        <h4 data-i18n="footer.legal_heading">Rechtliches</h4>
        <a href="impressum.html" data-i18n="footer.impressum">Impressum</a>
        <a href="datenschutz.html" data-i18n="footer.datenschutz">Datenschutz</a>
      </nav>
    </div>
    <p class="footer__legal" data-i18n="footer.legal_line">© 2026 Pleasance · Robin Wahl</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
  <script>
  (function () {
    var API_URL = 'https://formsubmit.co/ajax/hallo@pleasance.org';

    var form     = document.getElementById('contactForm');
    var submit   = document.getElementById('contactSubmit');
    var status   = document.getElementById('formStatus');
    var textarea = document.getElementById('contactMessage');

    var placeholders = {
      coaching: { de: 'Was bewegt dich gerade?',        en: 'What\'s on your mind?' },
      bureau:   { de: 'Was hast du vor?',               en: 'What are you planning?' },
      records:  { de: 'Erzähl mir von deinem Projekt.', en: 'Tell me about your project.' },
    };

    var activeTopic = 'coaching';
    var urlTopic = new URLSearchParams(location.search).get('thema');
    if (urlTopic && placeholders[urlTopic]) activeTopic = urlTopic;

    var pills = document.querySelectorAll('.form-topic');

    function setActiveTopic(topic) {
      activeTopic = topic;
      pills.forEach(function (btn) {
        btn.classList.toggle('is-active', btn.dataset.topic === topic);
      });
      updatePlaceholder();
    }

    function updatePlaceholder() {
      var lang = document.documentElement.lang || 'de';
      textarea.placeholder = (placeholders[activeTopic] || {})[lang] || '';
    }

    pills.forEach(function (btn) {
      btn.addEventListener('click', function () { setActiveTopic(btn.dataset.topic); });
    });

    setActiveTopic(activeTopic);

    new MutationObserver(updatePlaceholder).observe(
      document.documentElement, { attributes: true, attributeFilter: ['lang'] }
    );

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var name    = document.getElementById('contactName').value.trim();
      var email   = document.getElementById('contactEmail').value.trim();
      var message = textarea.value.trim();
      var lang    = document.documentElement.lang || 'de';
      if (!name || !email || !message) return;

      submit.disabled = true;
      submit.textContent = lang === 'en' ? 'Sending…' : 'Wird gesendet…';
      status.className = 'form-status';
      status.textContent = '';

      try {
        var res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ name: name, email: email, message: message, _subject: 'Coaching-Anfrage via pleasance.org', _captcha: 'false' }),
        });
        if (!res.ok) throw new Error(res.status);
        status.className = 'form-status is-success';
        status.textContent = lang === 'en'
          ? 'Thank you — I\'ll be in touch soon.'
          : 'Danke — ich melde mich bald.';
        form.reset();
        setActiveTopic('coaching');
      } catch (_) {
        status.className = 'form-status is-error';
        status.textContent = lang === 'en'
          ? 'Something went wrong. Try again or write to hallo@pleasance.org.'
          : 'Etwas hat nicht geklappt. Versuch es nochmal oder schreib an hallo@pleasance.org.';
      } finally {
        submit.disabled = false;
        submit.textContent = document.documentElement.lang === 'en' ? 'Send' : 'Absenden';
      }
    });
  })();
  </script>

</body>
</html>
